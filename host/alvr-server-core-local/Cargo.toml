# ALVR's server core (tag v20.14.1, MIT) with changes for cranvr, each marked "cranvr":
# - the web API listens on 127.0.0.1 instead of every network interface (src/web_server.rs).
#   The API has no login, so on the network it lets any device change the host's settings.
#   cranvr does not use the API;
# - the crate exports its log events, which the host reads for the headset's latency reports;
# - on macOS the game sound comes from the host (src/game_audio.rs), since macOS has no loopback
#   of the output device.
[package]
name = "alvr_server_core"
version = "20.14.1"
edition = "2021"
authors = ["alvr-org", "Valve Corporation"]
license = "MIT"

[features]
trace-performance = ["profiling/profile-with-tracy"]

[dependencies]
alvr_adb = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_audio = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_common = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_events = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_filesystem = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_packets = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_server_io = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_session = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_sockets = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }

ash = "0.38"
bincode = "1"
bytes = "1"
chrono = "0.4"
fern = "0.7"
flume = "0.11"
futures = "0.3"
headers = "0.3"
hyper = { version = "0.14", features = ["http2", "server", "stream", "runtime", "tcp"] }
mdns-sd = "0.13"
profiling = { version = "1", optional = true }
reqwest = "0.11"
rosc = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "fs"] }
tokio-tungstenite = "0.20"
tokio-util = { version = "0.7", features = ["codec"] }
serde = "1"
serde_json = "1"
sysinfo = "0.33"
