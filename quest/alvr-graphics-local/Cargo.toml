# ALVR's graphics crate (tag v20.14.1, MIT) with one change for cranvr, marked "cranvr": the
# staging fragment shader sets a default float precision. Mali GPUs, such as the Pixel 9's,
# refuse a fragment shader without one. Adreno GPUs, such as the Quest's, accept it.
[package]
name = "alvr_graphics"
version = "20.14.1"
edition = "2021"
rust-version = "1.82"
authors = ["alvr-org"]
license = "MIT"

[dependencies]
alvr_common = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }
alvr_session = { git = "https://github.com/alvr-org/ALVR", tag = "v20.14.1" }

glow = "0.16"
glyph_brush_layout = "0.2"
khronos-egl = { version = "6", features = ["dynamic"] }
pollster = "0.4"
wgpu = "24"
wgpu-core = { version = "24", features = ["gles"] }
