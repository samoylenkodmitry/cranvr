[package]
name = "cranvr-host"
description = "Streams Metal frames, games and the desktop from a Mac to a headset with cranvr's own protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cranvr-vt.workspace = true
cranvr-proto.workspace = true
serde_json.workspace = true
glam.workspace = true
log.workspace = true
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
cranvr-common.workspace = true
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "HostTime", "block2", "dispatch2", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"
objc2-core-graphics = "0.3"
