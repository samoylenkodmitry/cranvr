[workspace]
members = ["common", "vt", "proto", "host", "probe", "app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde_json = "1"
glam = "0.30"
log = "0.4"
cranvr-vt = { path = "vt" }
cranvr-common = { path = "common" }
cranvr-proto = { path = "proto" }

# Cranpose's wgpu forks at the revision that the app and the client pin. That Cranpose needs fork
# versions that crates.io gets only with Cranpose's next release.
[patch.crates-io]
cranpose-wgpu = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0b7f5306ef86a89414ed1f590e96c33e72155846" }
cranpose-wgpu-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0b7f5306ef86a89414ed1f590e96c33e72155846" }
cranpose-wgpu-hal = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0b7f5306ef86a89414ed1f590e96c33e72155846" }

[profile.release]
debug = 1

# Debug builds run the Reed-Solomon code in tests and in the host. It is about ten times slower without
# optimization.
[profile.dev.package.reed-solomon-simd]
opt-level = 3

# The cipher of the sealed packets is about fifty times slower without optimization.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3
