# cranvr-client: the new Quest client of cranvr. It is a pure Cranpose app. It uses Cranpose's
# public API and plain Rust crates such as cranvr-proto, and it has no ndk, JNI, GL, OpenXR or
# platform code of its own. It speaks cranvr's own protocol (cranvr-proto) to cranvr-host.
#
# Build the APK with scripts/build-client.sh. This crate is its own workspace, so the host's
# builds do not touch it. The desktop binary runs the same app in a flat window.
[workspace]

[package]
name = "cranvr-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "cranvr_client"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cranvr-client"
path = "src/main.rs"
required-features = ["desktop"]

# The Gradle plugin builds the Quest's library with `android` and `renderer-wgpu`. There the
# panels stand in the headset. On the desktop they draw flat. The phone's APK builds the same crate
# with `phone` and `renderer-wgpu`. That is a flat Android app with no OpenXR. Its screen shows the
# picture and its motion sensors are the head (`scripts/build-client.sh --phone`).
[features]
default = ["renderer-wgpu", "desktop"]
renderer-wgpu = ["cranpose/renderer-wgpu"]
desktop = ["cranpose/desktop", "dep:env_logger"]
# `gltf` loads the controller models that the Quest's runtime hands out (XR_FB_render_model)
android = ["renderer-wgpu", "cranpose/android", "cranpose-xr/openxr", "cranpose-xr/gltf"]
phone = ["renderer-wgpu", "cranpose/android"]
# A test build for a headset on a desk: a scripted hand types into the address field (src/scripted.rs)
scripted-hand = ["cranpose-xr/scripted-hand"]

[dependencies]
cranvr-proto = { path = "../proto" }
# The foveated layout that the host encodes: the client derives the same sizes
cranvr-common = { path = "../common" }
# One Cranpose revision for every Cranpose crate: the main branch of the Cranpose repository
cranpose = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c", features = ["embedded-default-font"] }
cranpose-xr = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }
# The output device and the queue for the host's sound (see src/audio.rs)
cranpose-audio = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }
log = "0.4"
serde_json = "1"
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
# A test composes the console's rows in a headless shell and reads the words on the screen
cranpose-testing = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }

[build-dependencies]
cranpose-capabilities = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }

# Cranpose's forks (wgpu, basisu) at the same revision. The pinned Cranpose needs fork versions that crates.io
# gets only with Cranpose's next release.
[patch.crates-io]
cranpose-wgpu = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }
cranpose-wgpu-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }
cranpose-wgpu-hal = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }
cranpose-tiny-skia = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }
cranpose-basisu = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "7d52c5d9c" }

# The Reed-Solomon code of the protocol is about ten times slower without optimization.
[profile.dev.package.reed-solomon-simd]
opt-level = 3

# The cipher of the sealed packets is about fifty times slower without optimization.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
debug = 1
