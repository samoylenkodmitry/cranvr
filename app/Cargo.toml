[package]
name = "cranvr-app"
description = "The cranvr window: starts the host, pairs headsets, launches games"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cranvr"
path = "src/main.rs"

[dependencies]
# The same Cranpose revision as the headset client (client/Cargo.toml)
cranpose = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0317feafe48f43948ddec4e7e048050c50dcc70e", features = ["desktop", "renderer-wgpu"] }
cranpose-core = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0317feafe48f43948ddec4e7e048050c50dcc70e" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
cranvr-common.workspace = true
rfd = "0.15"
# This Mac's address on the local network, for the headset's connect panel
local-ip-address = "0.6"
# Moves the cranvr window into VR (src/vr_window.rs)
objc2 = "0.6"
objc2-foundation = "0.3"
dispatch2 = "0.3"

[dev-dependencies]
# A test moves the mouse over the window's buttons with a headless shell and reads what they draw
cranpose-testing = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0317feafe48f43948ddec4e7e048050c50dcc70e" }
cranpose-render-common = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0317feafe48f43948ddec4e7e048050c50dcc70e" }
cranpose-ui-graphics = { git = "https://github.com/samoylenkodmitry/Cranpose", rev = "0317feafe48f43948ddec4e7e048050c50dcc70e" }
