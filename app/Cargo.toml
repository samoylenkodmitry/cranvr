[package]
name = "cranvr-app"
description = "The cranvr window: starts the host, pairs headsets, launches games"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cranvr"
path = "src/main.rs"

[dependencies]
cranpose = { version = "0.23", features = ["desktop", "renderer-wgpu"] }
cranpose-core = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
rfd = "0.15"
# Moves the cranvr window into VR (src/vr_window.rs)
objc2 = "0.6"
objc2-foundation = "0.3"
dispatch2 = "0.3"
